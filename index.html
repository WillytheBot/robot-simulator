<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>robot-simulator</title>  
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Robot Simulator</h1>
    <div class="robot-info card" id="robot-info">
        <h3 id="robot-name">Robot Name: UR5e</h3>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p>State: <span id="state-indicator"></span> <span id="robot-state-text">IDLE</span></p>
    </div>
    <div class="robot-position card" id="robot-position">
        <h3>Robot Position:</h3>
        <p>Coordinate:</p>
        <div class="coordinates">
            <p id="robot-x">X: 0</p>
            <p id="robot-y">Y: 0</p>
            <p id="robot-z">Z: 0</p>
        </div>
    </div>

    <div class="robot-controls card" id="robot-controls">
        <h3>Controls:</h3>
        <div class="control-row">
            <span class="axis-label">X</span>
            <button id="move-x-neg">−</button>
            <button id="move-x-pos">+</button>
        </div>
        <div class="control-row">
            <span class="axis-label">Y</span>
            <button id="move-y-neg">−</button>
            <button id="move-y-pos">+</button>
        </div>
        <div class="control-row">
            <span class="axis-label">Z</span>
            <button id="move-z-neg">−</button>
            <button id="move-z-pos">+</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
